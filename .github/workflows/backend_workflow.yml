name: Backend

on:
  pull_request:
    branches:
      - main
      - 'assign*'

jobs:
  coverage:
    name: Run project test coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Run coverage
        run: uv run pytest --cov=app

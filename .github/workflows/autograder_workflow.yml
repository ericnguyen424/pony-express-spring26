name: Autograder

on:
  pull_request:
    branches:
      - main
      'assign*'

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  ORGANIZATION: ${{ github.repository_owner }}

jobs:
  autograder:
    name: "Autograder: run tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Checkout autograder tests repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ORGANIZATION }}/pony-express-autograder-tests
          ref: ${{ env.BRANCH_NAME }}
          ssh-key: ${{ secrets.AUTOGRADER_TESTS_TOKEN }}
          path: autograder
          sparse-checkout: |
            autograder_tests

      - name: Move autograder tests
        run: mv autograder/autograder_tests ./

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Run autograder tests
        run: uv run pytest autograder_tests --no-header -rN -vv

[project]
name = "pony-express-backend"
version = "0.1.0"
description = "Backend REST API for Pony Express project"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Eric Nguyen (ericnguyen424)", email = "u1380461@utah.edu" },
]
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.8.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
